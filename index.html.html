<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #17171f;
}

/* =========================
   WELCOME PAGE
========================= */

.welcome-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 25px;
}

/* Background shapes */

.bg-circle {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
}

.circle-1 {
    width: 330px;
    height: 330px;
    background: #f1edff;
    top: -170px;
    right: -120px;
}

.circle-2 {
    width: 250px;
    height: 250px;
    background: #eefaff;
    bottom: -130px;
    left: -100px;
}

/* =========================
   MAIN CARD
========================= */

.card {
    width: 100%;
    max-width: 430px;
    min-height: 720px;

    background: rgba(255,255,255,0.92);

    border-radius: 38px;

    padding: 55px 30px 35px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    position: relative;
    z-index: 2;

    box-shadow:
        0 25px 70px rgba(35, 30, 70, 0.10);
}

/* =========================
   LOGO AREA
========================= */

.logo-area {
    width: 180px;
    height: 180px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 45px;

    position: relative;
}

/*
   ضع صورة Picho هنا
*/

.logo-area img {
    width: 180px;
    height: 180px;

    object-fit: contain;
}


/* =========================
   TEXT
========================= */

.small-title {
    font-size: 14px;
    font-weight: 700;

    letter-spacing: 3px;
    text-transform: uppercase;

    color: #8b86a3;

    margin-bottom: 12px;
}

h1 {
    font-size: 52px;
    line-height: 1;

    font-weight: 800;

    letter-spacing: -2px;

    margin-bottom: 22px;
}

h1 span {
    color: #745cff;
}

.description {
    max-width: 330px;

    color: #777386;

    font-size: 16px;

    line-height: 1.65;

    margin-bottom: 45px;
}


/* =========================
   START BUTTON
========================= */

.start-button {
    width: 100%;
    height: 64px;

    border: none;

    border-radius: 19px;

    background: #745cff;

    color: white;

    font-size: 17px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 14px 30px rgba(116, 92, 255, 0.25);

    transition: 0.25s ease;
}

.start-button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 18px 35px rgba(116, 92, 255, 0.32);
}

.start-button:active {
    transform: scale(0.97);
}


/* =========================
   BOTTOM
========================= */

.bottom-text {
    margin-top: auto;

    padding-top: 35px;

    font-size: 12px;

    color: #aaa6b7;
}

.bottom-text span {
    color: #745cff;
    font-weight: 700;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .welcome-page {
        padding: 14px;
    }

    .card {
        min-height: calc(100vh - 28px);

        border-radius: 32px;

        padding: 45px 25px 28px;
    }

    .logo-area {
        width: 165px;
        height: 165px;

        margin-bottom: 38px;
    }

    .logo-area img {
        width: 165px;
        height: 165px;
    }

    h1 {
        font-size: 48px;
    }

    .description {
        font-size: 15px;
        margin-bottom: 38px;
    }

    .start-button {
        height: 60px;
    }
}
#logo-area  {
       position: absolute;
   
       top: 38px;
       left: 50%;
   
       transform: translateX(-50%);
   
       width: 200px;
       height: 200px;
   
       object-fit: contain;
   
       z-index: 10;
animation: pichoFloat 3s ease-in-out infinite;
}
@keyframes pichoFloat {
